[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
salvo = { version = "0.82.0", features = ["oapi", "serve-static", "cors"] }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
